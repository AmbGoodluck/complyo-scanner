name: Complyo Send One Report

# Two ways this runs:
# 1. Fired automatically by the Polar webhook (repository_dispatch) when an
#    ORGANIC visitor subscribes -> sends the instant report (no sales CTA).
# 2. Run by hand from the Actions tab to send a PROSPECT their report -> set
#    is_prospect = true and provide checkout_url, so the email includes the
#    sales CTA and tags the checkout link so they are NOT double-reported.

on:
  repository_dispatch:
    types: [send_report]
  workflow_dispatch:
    inputs:
      email:
        description: "Recipient email"
        required: true
      website:
        description: "Website to scan (e.g. https://joespizza.com)"
        required: true
      is_prospect:
        description: "Is this a prospect (adds the subscribe CTA)?"
        type: boolean
        default: false
      checkout_url:
        description: "Production checkout link (only needed for prospects)"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/send-one.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          SUBSCRIBER_EMAIL: ${{ github.event.client_payload.email || github.event.inputs.email }}
          SUBSCRIBER_WEBSITE: ${{ github.event.client_payload.website || github.event.inputs.website }}
          # Prospect flag: only true when set manually. The webhook (organic) path
          # never sets it, so auto-sends stay non-prospect = instant report, no CTA.
          IS_PROSPECT: ${{ github.event.inputs.is_prospect || 'false' }}
          # Checkout link for the CTA. Falls back to the CHECKOUT_URL secret if set.
          CHECKOUT_URL: ${{ github.event.inputs.checkout_url || secrets.CHECKOUT_URL }}
