name: Complyo Scan

# Runs the scanner with zero human involvement:
#  - on a schedule (weekly here; change the cron as you like)
#  - on manual trigger from the Actions tab (workflow_dispatch)
# The scan reads urls.txt, scores every site, and uploads the results as a
# downloadable artifact. Later phases will push these results to Supabase and
# email reports instead of just uploading an artifact.

on:
  schedule:
    # 06:00 UTC every Monday. https://crontab.guru to change.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # Uses `npm install` so this works on the very first run, before a
        # package-lock.json is committed. Once you've committed the lockfile
        # (it's created by your local `npm install`), you can switch this to
        # `npm ci` and add `cache: "npm"` to the setup-node step above for
        # faster, reproducible CI installs.
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run scan
        run: npm run scan

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: complyo-scan-results
          path: output/
          retention-days: 30
